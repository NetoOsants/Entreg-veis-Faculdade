<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Semana 05 - Assincronismo</title>
</head>
<body>
    <h1>Semana 05 - Consumo de APIs</h1>
    
    <section>
        <h2>Buscador de CEP</h2>
        <form id="form-cep">
            <input type="text" id="input-cep" placeholder="Digite o CEP (8 dígitos)">
            <button type="submit" id="btn-cep">Buscar</button>
        </form>
        <p id="status-cep"></p>
        <dl id="resultado-cep"></dl>
        
        <h3>Histórico de Pesquisas</h3>
        <ul id="historico-cep"></ul>
    </section>

    <hr>

    <section>
        <h2>Mini Pokédex</h2>
        <form id="form-poke">
            <input type="text" id="input-poke" placeholder="Nome do Pokémon">
            <button type="submit" id="btn-poke">Buscar Pokémon</button>
        </form>
        <p id="status-poke"></p>
        <div id="resultado-poke"></div>
    </section>

    <script src="app.js"></script>
</body>
</html>
